    <style>
        body {
            margin: 0;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0e11;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;

            min-height: 100-vh;

        }

        .container {

        .logo {

            display: inline-block;
            background: linear-gradient(180deg, #ffeb3b 0%, #fbc02d 100%);
            color: #000;
            padding: 18px 40px;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(251, 192, 45, 0.4);
            animation: pulse 2s infinite;
            transition: transform 0.2s;
        }

        .cta-button:active {
            transform: scale(0.95);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(251, 192, 45, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(251, 192, 45, 0); }
            100% { box-shadow: 0 0 0 0 rgba(251, 192, 45, 0); }
